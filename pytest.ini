[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Exclude debug artifacts with non-UTF8 content from test discovery
norecursedirs = debug .git .venv env build dist htmlcov .pytest_cache .mypy_cache

# Output
# NOTE: Keep coverage collection enabled for local runs, but do not hard-fail
# targeted test runs on global coverage percentage. Enforce a stricter
# threshold in CI by running pytest with: --cov-fail-under=10
addopts = 
    --ignore=debug
    # Legacy unit tests still reference a removed `agent.*` package and an old
    # in-memory worker/queue framework that no longer exists in this repo.
    # Quarantine them for now so current-system tests can run. If you want to
    # revive them, migrate imports/APIs to `core/tiers/services` and remove these.
    --ignore=tests/unit/tier_1
    --ignore=tests/unit/tier_2
    --ignore=tests/unit/tier_3
    --ignore=tests/unit/core/test_agent.py
    --ignore=tests/unit/core/test_registry.py
    --ignore=tests/unit/core/test_queue_in_memory.py
    --ignore=tests/unit/core/test_worker.py
    --ignore=tests/unit/core/test_worker_audit.py
    -v
    --tb=short
    --strict-markers
    --cov=core
    --cov=tiers
    --cov=services
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=0

# Markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (requires Redis)
    smoke: Smoke tests (basic health checks)
    slow: Slow tests (>1 second)
    llm: Tests that call LLM APIs (requires API keys)
    chaos: Chaos engineering tests (failure scenarios)
    timeout: Test timeout in seconds (pytest-timeout)

# Asyncio
asyncio_mode = auto

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning

[coverage:run]
source = core, tiers, services
omit =
    tests/*
    .venv/*
    */migrations/*
    */site-packages/*
    */__pycache__/*
    */test_*.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    def __str__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod

stages:
  - lint
  - test
  - smoke
  - build
  - deploy

workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

variables:
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# ──────────────────────────────────────────────────────────────
# Stage: lint - Static code analysis (fast fail)
# ──────────────────────────────────────────────────────────────
lint:
  stage: lint
  image: python:3.13-slim
  cache:
    key: pip-cache
    paths:
      - .cache/pip
  before_script:
    - pip install --upgrade pip
    - pip install ruff mypy
  script:
    - ruff check . --output-format=gitlab > gl-code-quality-report.json || true
    - ruff check .
    - mypy . --ignore-missing-imports
  artifacts:
    reports:
      codequality: gl-code-quality-report.json
    when: always
  rules:
    - if: $CI_COMMIT_BRANCH

# ──────────────────────────────────────────────────────────────
# Stage: test - Unit + integration tests
# ──────────────────────────────────────────────────────────────
test:
  stage: test
  image: python:3.13-slim
  services:
    - redis:7-alpine
  variables:
    REDIS_URL: "redis://redis:6379/0"
    TENANT_ID: "test"
    PYTHONIOENCODING: "utf-8"
  cache:
    key: pip-cache
    paths:
      - .cache/pip
  before_script:
    - pip install --upgrade pip
    - pip install -r requirements.txt -r requirements-dev.txt
  script:
    - pytest tests/ -v --junitxml=report.xml --cov=. --cov-report=xml --cov-report=html
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - htmlcov/
    expire_in: 7 days
    when: always
  rules:
    - if: $CI_COMMIT_BRANCH

# ──────────────────────────────────────────────────────────────
# Stage: smoke - Minimal E2E path verification
# ──────────────────────────────────────────────────────────────
smoke:
  stage: smoke
  image: python:3.13-slim
  services:
    - redis:7-alpine
  variables:
    REDIS_URL: "redis://redis:6379/0"
    TENANT_ID: "ci-smoke"
    PYTHONIOENCODING: "utf-8"
  cache:
    key: pip-cache
    paths:
      - .cache/pip
  before_script:
    - pip install --upgrade pip
    - pip install -r requirements.txt -r requirements-dev.txt
  script:
    - python scripts/testing/inbound_e2e_live.py
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# ──────────────────────────────────────────────────────────────
# Stage: build - Docker images
# ──────────────────────────────────────────────────────────────
.default_docker:
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

build_worker:
  extends: .default_docker
  stage: build
  needs: ["lint", "test", "smoke"]
  script:
    - docker build -f deployment/docker/Dockerfile.worker -t "$CI_REGISTRY_IMAGE/worker:$IMAGE_TAG" .
    - docker push "$CI_REGISTRY_IMAGE/worker:$IMAGE_TAG"
  rules:
    - if: $CI_COMMIT_BRANCH

build_api_gateway:
  extends: .default_docker
  stage: build
  needs: ["lint", "test", "smoke"]
  script:
    - docker build -f api/gateway/Dockerfile -t "$CI_REGISTRY_IMAGE/api-gateway:$IMAGE_TAG" .
    - docker push "$CI_REGISTRY_IMAGE/api-gateway:$IMAGE_TAG"
  rules:
    - if: $CI_COMMIT_BRANCH

build_portal:
  extends: .default_docker
  stage: build
  needs: ["lint", "test", "smoke"]
  script:
    - docker build -f apps/portal/Dockerfile -t "$CI_REGISTRY_IMAGE/portal:$IMAGE_TAG" .
    - docker push "$CI_REGISTRY_IMAGE/portal:$IMAGE_TAG"
  rules:
    - if: $CI_COMMIT_BRANCH

# ──────────────────────────────────────────────────────────────
# Stage: deploy - Helm-based deployment to Kubernetes
# ──────────────────────────────────────────────────────────────
deploy:
  stage: deploy
  image: alpine/helm:3.14.0
  needs: ["build_worker", "build_api_gateway", "build_portal"]
  before_script:
    - echo "$KUBE_CONFIG" | base64 -d > /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
  script:
    - |
      helm upgrade --install agentic charts/agentic-system \
        --namespace agentic-system \
        --create-namespace \
        --set images.worker="${CI_REGISTRY_IMAGE}/worker:${IMAGE_TAG}" \
        --set images.apiGateway="${CI_REGISTRY_IMAGE}/api-gateway:${IMAGE_TAG}" \
        --set images.portal="${CI_REGISTRY_IMAGE}/portal:${IMAGE_TAG}" \
        --wait \
        --timeout 10m
  environment:
    name: production
    url: https://app.example.com
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      when: manual
    - when: never

# ──────────────────────────────────────────────────────────────
# Optional: Deploy to staging on develop branch
# ──────────────────────────────────────────────────────────────
deploy_staging:
  stage: deploy
  image: alpine/helm:3.14.0
  needs: ["build_worker", "build_api_gateway", "build_portal"]
  before_script:
    - echo "$KUBE_CONFIG_STAGING" | base64 -d > /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
  script:
    - |
      helm upgrade --install agentic-staging charts/agentic-system \
        --namespace agentic-staging \
        --create-namespace \
        --set images.worker="${CI_REGISTRY_IMAGE}/worker:${IMAGE_TAG}" \
        --set images.apiGateway="${CI_REGISTRY_IMAGE}/api-gateway:${IMAGE_TAG}" \
        --set images.portal="${CI_REGISTRY_IMAGE}/portal:${IMAGE_TAG}" \
        --set config.TENANT_ID="agentic-staging" \
        --set config.DEBUG="1" \
        --wait \
        --timeout 10m
  environment:
    name: staging
    url: https://staging.example.com
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual
    - when: never


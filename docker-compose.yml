###################################################################################################
# docker-compose.yml (Annotated)
# -------------------------------------------------------------------------------------------------
# Purpose: Define a local development stack consisting of:
#   - Redis (queue broker using Streams)
#   - Worker service (consumes jobs from Redis and processes them)
#   - Optional one-off ingestion CLI container (trigger jobs manually)
#
# Why Compose? It orchestrates multiple containers on a single host, wiring networking and
# environment variable injection so you can simulate distributed behavior locally.
# -------------------------------------------------------------------------------------------------

# 'version' is deprecated in modern Compose specs but included historically; Docker now ignores it.
# You can safely remove it; kept here commented for clarity.
# version: '3.9'

services:
  #################################################################################################
  # Redis Service
  # -----------------------------------------------------------------------------------------------
  # Lightweight ephemeral Redis instance (no AOF persistence) for local dev/testing. In production
  # you'd point REDIS_URL at a managed Redis (TLS, persistence, backups) and omit this service.
  #################################################################################################
  redis:
    image: redis:7-alpine                 # Small Redis image footprint
    container_name: agentic_redis         # Stable name for easier docker exec / logs
    command: ["redis-server", "--save", "", "--appendonly", "no"]  # Disable RDB + AOF => pure in-memory
    ports:
      - "6379:6379"                       # Host port => container port exposure (useful for external CLI inspection)
    volumes:
      - redis-data:/data                  # Persistent volume for AOF/RDB (if enabled in production)
    healthcheck:                           # Lets dependent services wait until Redis is ready
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped               # Auto-restart unless explicitly stopped
    # Only start this service when using the local profile. For Redis Cloud, omit this profile.
    profiles: ["local"]
    networks:
      - agentic-network

  #################################################################################################
  # PostgreSQL Service (Optional Local DB)
  # -----------------------------------------------------------------------------------------------
  # Local PostgreSQL instance for development. In production, use Supabase or managed PostgreSQL.
  #################################################################################################
  postgres:
    image: postgres:15-alpine
    container_name: agentic_postgres
    environment:
      POSTGRES_DB: agentic
      POSTGRES_USER: agentic
      POSTGRES_PASSWORD: agentic_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    profiles: ["local"]
    networks:
      - agentic-network

  #################################################################################################
  # Worker Service
  # -----------------------------------------------------------------------------------------------
  # Builds the application worker image (or reuses cached layers) and starts a long-lived process
  # that pulls jobs from Redis Streams. Scale this service for parallel processing.
  #################################################################################################
  worker:
    build:
      context: .                          # Build context root (sends only needed files per .dockerignore)
      dockerfile: deployment/docker/Dockerfile.worker  # Unified worker Dockerfile
    image: agentic/worker:dev             # Tag applied locally after build; can push to registry later
  # container_name removed to allow scaling multiple replicas without name conflicts
    env_file:
      - .env
    environment:
      # Runtime secret & config injection (never bake real secrets into the image)
      SUPABASE_URL: ${SUPABASE_URL}       # Provided via host .env
      SUPABASE_KEY: ${SUPABASE_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}     # Use Cloud if provided, else Compose Redis
      # Redis Streams configuration
      REDIS_NAMESPACE: ${REDIS_NAMESPACE:-agentic}
      REDIS_GROUP_WRITERS: ${REDIS_GROUP_WRITERS:-persist-writers}
      REDIS_STREAM_TASKS_WRITE: ${REDIS_STREAM_TASKS_WRITE:-persist:tasks}
      REDIS_STREAM_RESULTS_WRITE: ${REDIS_STREAM_RESULTS_WRITE:-persist:results}
      STREAM_MAXLEN: ${STREAM_MAXLEN:-1000}
      PERSIST_KIND: ${PERSIST_KIND:-supabase}
      WORKER_ONCE: ${WORKER_ONCE:-0}
      OPS_HB_ENABLED: ${OPS_HB_ENABLED:-1}  # Enable operational heartbeats
    # No hard dependency on the local redis service so Cloud can be used seamlessly.
    command: ["python", "-m", "tiers.tier_3.persistence_agent.write_worker"]
    restart: unless-stopped               # Resilient to crashes during dev
    deploy:
      resources:
        limits:
          cpus: '0.5'                    # Limit to 0.5 CPU cores
          memory: 512M                   # Limit to 512MB RAM
        reservations:
          cpus: '0.25'                   # Reserve 0.25 CPU cores
          memory: 256M                   # Reserve 256MB RAM
    networks:
      - agentic-network
    # Scaling (parallel workers) => docker compose up --scale worker=3
    # When scaling, remove container_name (Compose auto-names worker_1, worker_2, ...).

  #################################################################################################
  # RAG Worker Service (Streams)
  # -----------------------------------------------------------------------------------------------
  # Runs the RAG read worker under Compose so it also points to Redis Cloud via REDIS_URL.
  # Keep this at a single replica unless you want to fan out RAG queries.
  #################################################################################################
  rag_worker:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.worker
    image: agentic/worker:dev
    env_file:
      - .env
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TENANT_ID: ${TENANT_ID:-agentic-dev}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      # Redis Streams configuration (RAG path)
      REDIS_NAMESPACE: ${REDIS_NAMESPACE:-agentic-dev}
      REDIS_GROUP_WORKERS: ${REDIS_GROUP_WORKERS:-rag-workers}
      REDIS_STREAM_TASKS: ${REDIS_STREAM_TASKS:-rag:tasks}
      REDIS_STREAM_RESULTS: ${REDIS_STREAM_RESULTS:-rag:results}
      STREAM_MAXLEN: ${STREAM_MAXLEN:-1000}
      PERSIST_KIND: ${PERSIST_KIND:-supabase}
      WORKER_ONCE: ${WORKER_ONCE:-0}
      OPS_HB_ENABLED: ${OPS_HB_ENABLED:-1}  # Enable operational heartbeats
      REDIS_DEBUG: ${REDIS_DEBUG:-1}
    # No depends_on to allow Cloud Redis; if using local profile, Redis will be available as well.
    command: ["python", "-m", "tiers.tier_3.rag_agent.consumer"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'                    # RAG agent needs more CPU for embeddings
          memory: 1G                     # Higher memory for vector operations
        reservations:
          cpus: '0.5'
          memory: 512M
    profiles: ["rag"]  # Disabled by default due to LangChain v0.1+ compatibility issues
    networks:
      - agentic-network

  #################################################################################################
  # Persistence Worker Service (Deep Agent + Harness)
  # -----------------------------------------------------------------------------------------------
  # Runs persistence agent with hierarchical streams: {tenant}:agents:persistence:tasks/results
  #################################################################################################
  persistence_worker:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.worker
    image: agentic/worker:dev
    env_file:
      - .env
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TENANT_ID: ${TENANT_ID:-agentic-dev}
      PERSIST_KIND: ${PERSIST_KIND:-supabase}
      WORKER_ONCE: ${WORKER_ONCE:-0}
      OPS_HB_ENABLED: ${OPS_HB_ENABLED:-1}
      REDIS_DEBUG: ${REDIS_DEBUG:-1}
    command: ["python", "-m", "tiers.tier_3.persistence_agent.consumer"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - agentic-network

  #################################################################################################
  # Copywriter Worker Service (Deep Agent + Harness)
  # -----------------------------------------------------------------------------------------------
  # Runs copywriter agent with hierarchical streams: {tenant}:agents:copywriter:tasks/results
  #################################################################################################
  copywriter_worker:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.worker
    image: agentic/worker:dev
    env_file:
      - .env
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TENANT_ID: ${TENANT_ID:-agentic-dev}
      WORKER_ONCE: ${WORKER_ONCE:-0}
      OPS_HB_ENABLED: ${OPS_HB_ENABLED:-1}
      REDIS_DEBUG: ${REDIS_DEBUG:-1}
    command: ["python", "-m", "tiers.tier_3.copywriter_agent.consumer"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.75'                   # Copywriter needs CPU for LLM inference
          memory: 768M                   # Higher memory for model context
        reservations:
          cpus: '0.25'
          memory: 384M
    networks:
      - agentic-network

  #################################################################################################
  # Classifier Agent (Tier-3)
  # -----------------------------------------------------------------------------------------------
  # Rules-based email classifier for triage; determines route/store/drop action.
  #################################################################################################
  classifier_worker:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.worker
    image: agentic/worker:dev
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TENANT_ID: ${TENANT_ID:-agentic-dev}
      CLASSIFIER_LLM_ENABLED: ${CLASSIFIER_LLM_ENABLED:-0}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPS_HB_ENABLED: ${OPS_HB_ENABLED:-1}
    command: ["python", "-m", "tiers.tier_3.classifier_agent.consumer"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - agentic-network

  #################################################################################################
  # Inbound Orchestrator (Tier-2)
  # -----------------------------------------------------------------------------------------------
  # Classifies inbound emails and routes to Leads (reply), Persistence (store), or drops.
  #################################################################################################
  inbound_orchestrator:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.worker
    image: agentic/worker:dev
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TENANT_ID: ${TENANT_ID:-agentic-dev}
      CLASSIFIER_LLM_ENABLED: ${CLASSIFIER_LLM_ENABLED:-0}
      OPS_HB_ENABLED: ${OPS_HB_ENABLED:-1}
    command: ["python", "-m", "tiers.tier_2.inbound_orchestrator.consumer"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - agentic-network

  #################################################################################################
  # Leads Orchestrator (Tier-2)
  # -----------------------------------------------------------------------------------------------
  # Required for inbound email flows: inbound_orchestrator forwards actionable emails here.
  #################################################################################################
  leads_orchestrator:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.worker
    image: agentic/worker:dev
    env_file:
      - .env
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_NAMESPACE: ${REDIS_NAMESPACE:-agentic-dev}
      TENANT_ID: ${TENANT_ID:-agentic-dev}
      OPS_HB_ENABLED: ${OPS_HB_ENABLED:-1}
      REDIS_DEBUG: ${REDIS_DEBUG:-1}
    command: ["python", "-m", "tiers.tier_2.leads_orchestrator.consumer"]
    restart: unless-stopped
    networks:
      - agentic-network

  #################################################################################################
  # Outreach/Outbound Orchestrator (Tier-2)
  # -----------------------------------------------------------------------------------------------
  # Handles outbound orchestration and delegates to Copywriter.
  #################################################################################################
  outreach_orchestrator:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.worker
    image: agentic/worker:dev
    env_file:
      - .env
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_NAMESPACE: ${REDIS_NAMESPACE:-agentic-dev}
      TENANT_ID: ${TENANT_ID:-agentic-dev}
      OPS_HB_ENABLED: ${OPS_HB_ENABLED:-1}
      REDIS_DEBUG: ${REDIS_DEBUG:-1}
    command: ["python", "-m", "tiers.tier_2.outreach_orchestrator.consumer"]
    restart: unless-stopped
    networks:
      - agentic-network

  #################################################################################################
  # Ingestion CLI (Profile-Gated)
  # -----------------------------------------------------------------------------------------------
  # Optional ad-hoc container to enqueue a single ingestion event using the same image build
  # context (no need to have the worker binary on host). Hidden behind profile so it doesn't run
  # automatically with the main stack.
  #################################################################################################
  #################################################################################################
  # Workflow Orchestrator Service
  # -----------------------------------------------------------------------------------------------
  # Manages multi-step workflows and coordinates between RAG, Copy, and Persistence workers.
  #################################################################################################
  orchestrator:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.worker
    image: agentic/worker:dev
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_NAMESPACE: ${REDIS_NAMESPACE:-agentic-dev}
      OPS_HB_ENABLED: ${OPS_HB_ENABLED:-1}
      WORKFLOW_STATE_ENABLED: ${WORKFLOW_STATE_ENABLED:-1}
      REDIS_DEBUG: ${REDIS_DEBUG:-1}
    command: ["python", "-m", "tiers.tier_1.manager.consumer"]
    restart: unless-stopped
    networks:
      - agentic-network

  #################################################################################################
  # Inbox Poller (Tier-0 Ingress)
  # -----------------------------------------------------------------------------------------------
  # Polls Gmail API or IMAP and publishes typed envelopes to `{tenant}:manager:tasks`.
  # Profile-gated so the core stack can run without inbox credentials present.
  #################################################################################################
  inbox_poller:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.worker
    image: agentic/worker:dev
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TENANT_ID: ${TENANT_ID:-agentic-dev}
      INBOX_PROVIDER: ${INBOX_PROVIDER:-gmail}
      INBOX_POLL_INTERVAL_S: ${INBOX_POLL_INTERVAL_S:-60}
      GMAIL_INBOX_USER: ${GMAIL_INBOX_USER:-me}
      # OAuth in containers is typically headless; use a stable local callback.
      GMAIL_OAUTH_FLOW: ${GMAIL_OAUTH_FLOW:-headless}
      GMAIL_OAUTH_HOST: ${GMAIL_OAUTH_HOST:-0.0.0.0}
      GMAIL_OAUTH_PUBLIC_HOST: ${GMAIL_OAUTH_PUBLIC_HOST:-localhost}
      GMAIL_OAUTH_PORT: ${GMAIL_OAUTH_PORT:-8080}
      # IMPORTANT: inside the container, always use the mounted paths under /data/gmail.
      # Do not inherit host absolute paths from .env (those won't exist in the container).
      GMAIL_READ_CREDENTIALS_PATH: /data/gmail/credentials.json
      GMAIL_TOKEN_PATH: /data/gmail/gmail_token.json
      INBOX_DEDUP_TTL_SECONDS: ${INBOX_DEDUP_TTL_SECONDS:-86400}
      INBOX_PRE_FILTER_ENABLED: ${INBOX_PRE_FILTER_ENABLED:-1}
      INBOX_PRE_FILTER_SKIP_CATEGORIES: ${INBOX_PRE_FILTER_SKIP_CATEGORIES:-bounce}
      INBOX_PRE_FILTER_SKIP_CONFIDENCE: ${INBOX_PRE_FILTER_SKIP_CONFIDENCE:-0.8}
    command: ["python", "-m", "services.email.inbox_poller"]
    ports:
      - "${GMAIL_OAUTH_PORT:-8080}:${GMAIL_OAUTH_PORT:-8080}"
    volumes:
      # Persist OAuth token across restarts
      - gmail-oauth:/data/gmail
      # Mount your Google OAuth client secrets JSON (read-only)
      # Create this file locally at: ./secrets/gmail_credentials.json
      - ./secrets/gmail_credentials.json:/data/gmail/credentials.json:ro
    # OAuth token creation needs to write under /data/gmail; easiest for now is root.
    user: "0:0"
    restart: unless-stopped
    profiles: ["inbox"]
    networks:
      - agentic-network

  #################################################################################################
  # Inbox Webhook Receiver (Tier-0 Ingress, Backup)
  # -----------------------------------------------------------------------------------------------
  # FastAPI endpoint that accepts normalized inbound_email_event payloads and publishes to Manager.
  # This is a backup ingress and/or used for push-based providers.
  #################################################################################################
  inbox_webhook:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.worker
    image: agentic/worker:dev
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      INBOX_WEBHOOK_SECRET: ${INBOX_WEBHOOK_SECRET}
      INBOX_WEBHOOK_HOST: 0.0.0.0
      INBOX_WEBHOOK_PORT: ${INBOX_WEBHOOK_PORT:-8081}
    command: ["python", "-m", "services.email.webhook_receiver"]
    ports:
      - "8081:8081"
    restart: unless-stopped
    profiles: ["inbox"]
    networks:
      - agentic-network

  #################################################################################################
  # Health Server Service
  # -----------------------------------------------------------------------------------------------
  # HTTP endpoint for health checks and operational metrics. Exposes /health, /healthz, /ready,
  # and /metrics endpoints for monitoring.
  #################################################################################################
  health_server:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.worker
    image: agentic/worker:dev
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_NAMESPACE: ${REDIS_NAMESPACE:-agentic-dev}
    command: ["python", "scripts/health_server.py", "--host", "0.0.0.0", "--port", "8080", "--enable-metrics"]
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - agentic-network

  #################################################################################################
  # Internal Frontend (Streamlit)
  # -----------------------------------------------------------------------------------------------
  # Internal admin dashboard for task submission and stream monitoring.
  #################################################################################################
  internal_frontend:
    build:
      context: ./int-frontend
      dockerfile: Dockerfile
    container_name: agentic_frontend
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      TENANT_ID: ${TENANT_ID:-agentic-dev}
    ports:
      - "8501:8501"
    restart: unless-stopped
    networks:
      - agentic-network

  ingest_cli:
    build:
      context: .
    entrypoint: ["python", "scripts/ingest_cli.py", "--mode", "ingest"]  # One-shot process then exit
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      QUEUE_BACKEND: redis
      INGEST_TO_DB: "true"
    # No depends_on so this tool can run against Redis Cloud when REDIS_URL is set.
    networks:
      - agentic-network
    profiles: ["tools"]                 # Invoke explicitly: `docker compose --profile tools run --rm ingest_cli`

###################################################################################################
# Volumes & Networks
# -------------------------------------------------------------------------------------------------
# Persistent volumes for local data storage and isolated networking
###################################################################################################
volumes:
  redis-data:
  postgres-data:
  gmail-oauth:

networks:
  agentic-network:
    driver: bridge

###################################################################################################
# Usage Summary
# -------------------------------------------------------------------------------------------------
# Build + start (foreground logs):
#   docker compose --env-file .env up --build
# Start with local profile (includes Redis + PostgreSQL):
#   docker compose --profile local --env-file .env up --build
# Scale workers to 3 replicas:
#   docker compose up --build --scale worker=3
# One-off ingestion (profile):
#   docker compose --env-file .env --profile tools run --rm ingest_cli
# Check health:
#   curl http://localhost:8080/health | jq
# Tail logs:
#   docker compose logs -f worker
# Stop & remove containers:
#   docker compose down
# Stop & remove volumes (⚠️ deletes data):
#   docker compose down -v
# -------------------------------------------------------------------------------------------------
# Production Differences
# - Omit the redis service (point REDIS_URL to managed Redis instead)
# - Use an image pulled from a registry (skip build section) 
# - Provide secrets via your orchestrator's secret manager
# - Scale using orchestrator (ECS/Kubernetes) rather than Compose `--scale`
# - Enable TLS for Redis connections
# - Configure resource limits and health check timeouts
###################################################################################################

# Default intent to orchestrator mapping for Tier 1 Manager
# You can override per-tenant by creating:
#   config/tenants/<tenant_id>/manager_routing.yaml

intents:
  start_campaign: [control, leads, outreach]
  lead_enrichment: [leads]
  outreach: [outreach]
  audit: [audit]
  # Inbound email now goes through Inbound Orchestrator for classification.
  # The Inbound Orchestrator will:
  # 1. Classify the email (personal, newsletter, bounce, etc.)
  # 2. Route to Leads Orchestrator if actionable (personal, business_inquiry)
  # 3. Store-only for newsletters/marketing (no reply)
  # 4. Drop bounces/spam
  inbound: [inbound]
  control: [control]

# When an intent is unknown or has no mapping, send to this orchestrator
default_fallback_orchestrator: control

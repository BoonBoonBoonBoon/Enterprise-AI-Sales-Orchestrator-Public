name: CI

on:
  push:
    branches: [main, master, hazard, develop/hazard, develop/safe]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install -r requirements-dev.txt || true
          pip install ruff mypy pytest pytest-cov pytest-asyncio fakeredis
      
      - name: Lint with ruff
        run: |
          ruff check agent/ tests/ --output-format=github || true
        continue-on-error: true
      
      - name: Type check with mypy
        run: |
          mypy agent/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install -r requirements-dev.txt || true
          pip install pytest pytest-cov pytest-asyncio fakeredis
      
      - name: Run pytest (if tests exist)
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_DB: 0
          REDIS_NAMESPACE: agentic-test
          PERSIST_KIND: memory
        run: |
          if [ -d "tests" ]; then
            pytest tests/ -v --cov=agent --cov-report=xml --cov-report=term || true
          else
            echo "No tests directory found, skipping pytest"
          fi
        continue-on-error: true
      
      - name: Run unittest (legacy)
        run: |
          python -m unittest discover -v || echo "No unittest tests found"
        continue-on-error: true
      
      - name: Upload coverage to Codecov
        if: hashFiles('coverage.xml') != ''
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  envelope-validation:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run envelope system test
        run: |
          python test_envelope_system.py
      
      - name: Validate envelope schema
        run: |
          python -c "from agent.utils.typed_envelope import task, result, error, to_redis_fields, from_redis_message, Priority, Status; print('✓ Envelope schema imports successful')"

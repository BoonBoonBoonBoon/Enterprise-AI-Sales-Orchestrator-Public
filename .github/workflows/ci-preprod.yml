name: CI - Pre-Production

on:
  push:
    branches:
      - preprod
  pull_request:
    branches:
      - preprod
  workflow_dispatch:

jobs:
  quality-checks:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 mypy pytest pytest-cov pytest-asyncio
      
      - name: Lint with flake8
        run: |
          echo "::group::Linting Code"
          flake8 . --count --show-source --statistics
          echo "::endgroup::"
        continue-on-error: false
      
      - name: Type check with mypy
        run: |
          echo "::group::Type Checking"
          mypy agent tests || true
          echo "::endgroup::"
        continue-on-error: true
      
      - name: Import smoke tests
        run: |
          echo "::group::Import Tests"
          pytest tests/test_imports.py -v --tb=short
          echo "::endgroup::"
        continue-on-error: false
      
      - name: Run unit tests
        env:
          REDIS_URL: redis://localhost:6379
          ENV: test
        run: |
          echo "::group::Unit Tests"
          pytest tests/unit/ -v -m "unit" --tb=short --cov=agent --cov-report=xml --cov-report=term-missing
          echo "::endgroup::"
        continue-on-error: false
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-preprod
        continue-on-error: true
      
      - name: Check coverage threshold
        run: |
          COVERAGE=$(python -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); root = tree.getroot(); print(root.attrib['line-rate'])")
          COVERAGE_PCT=$(python -c "print(f'{float('$COVERAGE') * 100:.2f}')")
          echo "Coverage: ${COVERAGE_PCT}%"
          if (( $(echo "$COVERAGE < 0.60" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE_PCT}% is below 60% threshold"
            exit 1
          fi
        continue-on-error: true
      
      - name: Summary
        if: always()
        run: |
          echo "## CI Summary - Pre-Production" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Author:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Checks" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Code linting passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Type checking completed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Import tests passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Unit tests passed" >> $GITHUB_STEP_SUMMARY

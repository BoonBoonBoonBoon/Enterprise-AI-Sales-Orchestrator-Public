name: CI - Production

on:
  push:
    branches:
      - hazard
  pull_request:
    branches:
      - hazard
  workflow_dispatch:

jobs:
  preprod-checks:
    name: Pre-Production Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 mypy pytest pytest-cov pytest-asyncio
      
      - name: Lint with flake8
        run: |
          echo "::group::Linting Code"
          flake8 . --count --show-source --statistics
          echo "::endgroup::"
      
      - name: Type check with mypy
        run: |
          echo "::group::Type Checking"
          mypy agent tests || true
          echo "::endgroup::"
        continue-on-error: true
      
      - name: Import smoke tests
        run: |
          echo "::group::Import Tests"
          pytest tests/test_imports.py -v --tb=short
          echo "::endgroup::"
      
      - name: Run unit tests
        env:
          REDIS_URL: redis://localhost:6379
          ENV: test
        run: |
          echo "::group::Unit Tests"
          pytest tests/unit/ -v -m "unit" --tb=short
          echo "::endgroup::"
  
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: preprod-checks
    timeout-minutes: 20
    
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-timeout
      
      - name: Verify Redis connectivity
        run: |
          pip install redis
          python -c "import redis; r = redis.Redis(host='localhost', port=6379); r.ping(); print('✅ Redis connected')"
      
      - name: Run integration tests
        env:
          REDIS_URL: redis://localhost:6379
          ENV: test
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "::group::Integration Tests"
          pytest tests/integration/ -v -m "integration" --tb=short --timeout=60
          echo "::endgroup::"
      
      - name: Run smoke tests
        env:
          REDIS_URL: redis://localhost:6379
        run: |
          echo "::group::Smoke Tests"
          pytest tests/smoke/ -v -m "smoke" --tb=short
          echo "::endgroup::"
        continue-on-error: true
      
      - name: Redis Cloud validation
        if: github.event_name == 'push'
        env:
          REDIS_CLOUD_URL: ${{ secrets.REDIS_CLOUD_URL }}
        run: |
          if [ -n "$REDIS_CLOUD_URL" ]; then
            echo "::group::Redis Cloud Validation"
            python -c "
            import redis
            import os
            url = os.environ.get('REDIS_CLOUD_URL')
            r = redis.from_url(url)
            r.ping()
            print('✅ Redis Cloud connected')
            "
            echo "::endgroup::"
          else
            echo "⚠️ REDIS_CLOUD_URL not configured, skipping"
          fi
        continue-on-error: true
  
  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: integration-tests
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build RAG worker image
        run: |
          docker build -f agent/operational_agents/rag_agent/Dockerfile -t agentic-rag-worker:${{ github.sha }} .
          docker images | grep agentic-rag-worker
      
      - name: Build Copywriter worker image
        run: |
          docker build -f agent/operational_agents/copywriter/Dockerfile -t agentic-copywriter-worker:${{ github.sha }} .
          docker images | grep agentic-copywriter-worker
        continue-on-error: true
      
      - name: Build Persistence worker image
        run: |
          docker build -f agent/operational_agents/persistence_agent/Dockerfile -t agentic-persistence-worker:${{ github.sha }} .
          docker images | grep agentic-persistence-worker
        continue-on-error: true
      
      - name: Test image startup
        run: |
          docker run --rm agentic-rag-worker:${{ github.sha }} python -c "print('✅ Image runs successfully')"
        continue-on-error: true
  
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [preprod-checks, integration-tests, docker-build]
    if: always()
    
    steps:
      - name: Generate summary
        run: |
          echo "## CI Summary - Production (hazard)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Author:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Workflow:** ${{ github.workflow }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job Results" >> $GITHUB_STEP_SUMMARY
          echo "- Pre-Production Checks: ${{ needs.preprod-checks.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Integration Tests: ${{ needs.integration-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Docker Build: ${{ needs.docker-build.result }}" >> $GITHUB_STEP_SUMMARY
      
      - name: Check overall status
        run: |
          if [ "${{ needs.preprod-checks.result }}" != "success" ] || [ "${{ needs.integration-tests.result }}" != "success" ]; then
            echo "::error::CI pipeline failed"
            exit 1
          fi
          echo "✅ All checks passed - Ready for production deployment"

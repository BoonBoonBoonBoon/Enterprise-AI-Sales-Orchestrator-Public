global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'agentic-system'

scrape_configs:
  # ============================================================================
  # TIER 1 - Manager
  # ============================================================================
  - job_name: 'manager'
    static_configs:
      - targets: ['manager:8000']
    relabel_configs:
      - source_labels: [__address__]
        target_label: tier
        replacement: manager

  # ============================================================================
  # TIER 2 - Orchestrators (ports 8010-8019)
  # ============================================================================
  - job_name: 'orchestrators'
    static_configs:
      - targets:
          - 'leads_orchestrator:8010'
          - 'outreach_orchestrator:8011'
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+):.*'
        target_label: component
        replacement: '$1'
      - source_labels: [__address__]
        target_label: tier
        replacement: orchestrator

  # ============================================================================
  # TIER 3 - Agents (ports 8020-8029)
  # ============================================================================
  - job_name: 'agents'
    static_configs:
      - targets:
          - 'persistence_agent:8020'
          - 'rag_agent:8021'
          - 'copywriter_agent:8022'
          - 'channel_sequencer_agent:8023'
          - 'scheduler_agent:8025'
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+):.*'
        target_label: component
        replacement: '$1'
      - source_labels: [__address__]
        target_label: tier
        replacement: agent

  # ============================================================================
  # Infrastructure
  # ============================================================================
  # Redis exporter
  - job_name: 'redis'
    static_configs:
      - targets: ['redis_exporter:9121']

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

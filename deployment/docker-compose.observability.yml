services:
  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: agentic_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - agentic-network
    restart: unless-stopped

  # Loki - Log aggregation
  loki:
    image: grafana/loki:latest
    container_name: agentic_loki
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    networks:
      - agentic-network
    restart: unless-stopped

  # Promtail - Log shipper (scrapes Docker logs)
  promtail:
    image: grafana/promtail:latest
    container_name: agentic_promtail
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml
      - //var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    networks:
      - agentic-network
    restart: unless-stopped

  # Grafana - Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: agentic_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=redis-datasource
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - agentic-network
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  # Tempo - Distributed tracing (optional)
  tempo:
    image: grafana/tempo:latest
    container_name: agentic_tempo
    ports:
      - "3200:3200"   # Tempo
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      - ./tempo/tempo.yml:/etc/tempo.yaml
      - tempo_data:/tmp/tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    networks:
      - agentic-network
    restart: unless-stopped

  # Redis Exporter - Monitor Redis metrics (optional - only if you have Redis running)
  # Uncomment if you have a Redis service named 'agentic_redis' or update REDIS_ADDR
  # redis_exporter:
  #   image: oliver006/redis_exporter:latest
  #   container_name: agentic_redis_exporter
  #   ports:
  #     - "9121:9121"
  #   environment:
  #     - REDIS_ADDR=host.docker.internal:6379  # For Redis on host machine
  #   networks:
  #     - agentic_network
  #   restart: unless-stopped

volumes:
  prometheus_data:
  loki_data:
  grafana_data:
  tempo_data:

networks:
  agentic-network:
    driver: bridge

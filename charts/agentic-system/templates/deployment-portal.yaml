{{- if .Values.portal.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: {{ include "agentic.namespace" . }}
  labels:
    app: portal
spec:
  replicas: {{ .Values.portal.replicas }}
  selector:
    matchLabels:
      app: portal
  template:
    metadata:
      labels:
        app: portal
    spec:
      containers:
        - name: portal
          image: {{ .Values.images.portal | quote }}
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: agentic-config
          ports:
            - name: http
              containerPort: 3000
          resources:
{{ toYaml .Values.portal.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
{{- end }}

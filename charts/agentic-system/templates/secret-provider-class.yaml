{{- if eq .Values.secrets.provider "aws" }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: agentic-aws-secrets
  namespace: {{ include "agentic.namespace" . }}
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "{{ .Values.secrets.aws.secretName }}"
        objectType: "secretsmanager"
        jmesPath:
          - path: OPENAI_API_KEY
            objectAlias: OPENAI_API_KEY
          - path: ANTHROPIC_API_KEY
            objectAlias: ANTHROPIC_API_KEY
          - path: REDIS_URL
            objectAlias: REDIS_URL
          - path: SUPABASE_URL
            objectAlias: SUPABASE_URL
          - path: SUPABASE_KEY
            objectAlias: SUPABASE_KEY
          - path: SUPABASE_ANON_KEY
            objectAlias: SUPABASE_ANON_KEY
          - path: SUPABASE_JWT_SECRET
            objectAlias: SUPABASE_JWT_SECRET
          - path: JWT_SECRET
            objectAlias: JWT_SECRET
          - path: DEV_LOGIN_SECRET
            objectAlias: DEV_LOGIN_SECRET
  secretObjects:
  - secretName: agentic-secrets
    type: Opaque
    data:
    - objectName: OPENAI_API_KEY
      key: OPENAI_API_KEY
    - objectName: ANTHROPIC_API_KEY
      key: ANTHROPIC_API_KEY
    - objectName: REDIS_URL
      key: REDIS_URL
    - objectName: SUPABASE_URL
      key: SUPABASE_URL
    - objectName: SUPABASE_KEY
      key: SUPABASE_KEY
    - objectName: SUPABASE_ANON_KEY
      key: SUPABASE_ANON_KEY
    - objectName: SUPABASE_JWT_SECRET
      key: SUPABASE_JWT_SECRET
    - objectName: JWT_SECRET
      key: JWT_SECRET
    - objectName: DEV_LOGIN_SECRET
      key: DEV_LOGIN_SECRET
---
{{- end }}
{{- if eq .Values.secrets.provider "azure" }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: agentic-azure-secrets
  namespace: {{ include "agentic.namespace" . }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "{{ .Values.secrets.azure.clientId }}"
    keyvaultName: "{{ .Values.secrets.azure.keyVaultName }}"
    tenantId: "{{ .Values.secrets.azure.tenantId }}"
    objects: |
      array:
        - |
          objectName: OPENAI-API-KEY
          objectType: secret
          objectAlias: OPENAI_API_KEY
        - |
          objectName: ANTHROPIC-API-KEY
          objectType: secret
          objectAlias: ANTHROPIC_API_KEY
        - |
          objectName: REDIS-URL
          objectType: secret
          objectAlias: REDIS_URL
        - |
          objectName: SUPABASE-URL
          objectType: secret
          objectAlias: SUPABASE_URL
        - |
          objectName: SUPABASE-KEY
          objectType: secret
          objectAlias: SUPABASE_KEY
        - |
          objectName: SUPABASE-ANON-KEY
          objectType: secret
          objectAlias: SUPABASE_ANON_KEY
        - |
          objectName: SUPABASE-JWT-SECRET
          objectType: secret
          objectAlias: SUPABASE_JWT_SECRET
        - |
          objectName: JWT-SECRET
          objectType: secret
          objectAlias: JWT_SECRET
        - |
          objectName: DEV-LOGIN-SECRET
          objectType: secret
          objectAlias: DEV_LOGIN_SECRET
  secretObjects:
  - secretName: agentic-secrets
    type: Opaque
    data:
    - objectName: OPENAI_API_KEY
      key: OPENAI_API_KEY
    - objectName: ANTHROPIC_API_KEY
      key: ANTHROPIC_API_KEY
    - objectName: REDIS_URL
      key: REDIS_URL
    - objectName: SUPABASE_URL
      key: SUPABASE_URL
    - objectName: SUPABASE_KEY
      key: SUPABASE_KEY
    - objectName: SUPABASE_ANON_KEY
      key: SUPABASE_ANON_KEY
    - objectName: SUPABASE_JWT_SECRET
      key: SUPABASE_JWT_SECRET
    - objectName: JWT_SECRET
      key: JWT_SECRET
    - objectName: DEV_LOGIN_SECRET
      key: DEV_LOGIN_SECRET
---
{{- end }}

{{- if .Values.healthServer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-server
  namespace: {{ include "agentic.namespace" . }}
  labels:
    app: health-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: health-server
  template:
    metadata:
      labels:
        app: health-server
    spec:
      serviceAccountName: agentic-worker
      containers:
        - name: health-server
          image: {{ .Values.images.worker | quote }}
          imagePullPolicy: IfNotPresent
          command: ["python", "scripts/health_server.py", "--host", "0.0.0.0", "--port", "8080", "--enable-metrics"]
          envFrom:
            - configMapRef:
                name: agentic-config
            - secretRef:
                name: agentic-secrets
          ports:
            - name: http
              containerPort: 8080
          resources:
{{ toYaml .Values.healthServer.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
---
{{- end }}

apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: agentic-azure-secrets
  namespace: agentic-system
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: ""  # Will use workload identity
    keyvaultName: "agentic-system-prod"  # UPDATE THIS with your Key Vault name
    tenantId: ""  # UPDATE THIS with your Azure tenant ID
    objects: |
      array:
        - |
          objectName: OPENAI-API-KEY
          objectType: secret
          objectAlias: OPENAI_API_KEY
        - |
          objectName: ANTHROPIC-API-KEY
          objectType: secret
          objectAlias: ANTHROPIC_API_KEY
        - |
          objectName: REDIS-URL
          objectType: secret
          objectAlias: REDIS_URL
        - |
          objectName: SUPABASE-URL
          objectType: secret
          objectAlias: SUPABASE_URL
        - |
          objectName: SUPABASE-KEY
          objectType: secret
          objectAlias: SUPABASE_KEY
  secretObjects:
  - secretName: agentic-secrets
    type: Opaque
    data:
    - objectName: OPENAI_API_KEY
      key: OPENAI_API_KEY
    - objectName: ANTHROPIC_API_KEY
      key: ANTHROPIC_API_KEY
    - objectName: REDIS_URL
      key: REDIS_URL
    - objectName: SUPABASE_URL
      key: SUPABASE_URL
    - objectName: SUPABASE_KEY
      key: SUPABASE_KEY

apiVersion: v1
kind: ConfigMap
metadata:
  name: agentic-config
  namespace: agentic-system
data:
  # Operational Configuration
  OPS_HB_ENABLED: "1"
  OPS_HB_TTL: "30"
  OPS_HB_INTERVAL: "10"
  REDIS_STREAM_MAXLEN: "20000"
  ENABLE_DLQ: "1"
  REDIS_MAX_RETRIES: "2"
  REDIS_RETRY_BACKOFF_MS: "0"
  REDIS_NAMESPACE: "agentic-prod"
  
  # Stream Configuration
  REDIS_GROUP_WRITERS: "persist-writers"
  REDIS_GROUP_WORKERS: "rag-workers"
  REDIS_STREAM_TASKS: "rag:tasks"
  REDIS_STREAM_RESULTS: "rag:results"
  REDIS_STREAM_TASKS_WRITE: "persist:tasks"
  REDIS_STREAM_RESULTS_WRITE: "persist:results"
  REDIS_STREAM_DLQ: "rag:dlq"
  REDIS_STREAM_DLQ_WRITE: "persist:dlq"
  
  # Worker Configuration
  PERSIST_KIND: "supabase"
  WORKER_ONCE: "0"
  REDIS_DEBUG: "0"
  TENANT_ID: "agentic-prod"
  
  # LLM Configuration
  LLM_PROVIDER: "openai"
  ENABLE_LEAD_CONTEXT_ENRICHMENT: "1"

  # API Gateway
  HOST: "0.0.0.0"
  PORT: "8000"
  DEBUG: "0"
  DEV_LOGIN_ENABLED: "0"
  CORS_ORIGINS: "https://app.example.com"
  RATE_LIMIT_REQUESTS: "100"
  RATE_LIMIT_WINDOW_SECONDS: "60"

  # Portal (Next.js)
  NEXT_PUBLIC_SUPABASE_URL: "https://your-project.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "REPLACE_ME"
  NEXT_PUBLIC_API_URL: "https://app.example.com/api"

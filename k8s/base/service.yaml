apiVersion: v1
kind: Service
metadata:
  name: health-server
  namespace: agentic-system
  labels:
    app: health-server
spec:
  type: LoadBalancer
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  selector:
    app: health-server
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: agentic-system
  labels:
    app: redis
spec:
  type: ClusterIP
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
    protocol: TCP
  selector:
    app: redis

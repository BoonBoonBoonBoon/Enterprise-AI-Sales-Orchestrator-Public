apiVersion: apps/v1
kind: Deployment
metadata:
  name: manager
  namespace: agentic-system
  labels:
    app: manager
    component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: manager
  template:
    metadata:
      labels:
        app: manager
        component: worker
    spec:
      serviceAccountName: agentic-worker
      containers:
        - name: manager
          image: agentic/worker:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "tiers.tier_1.manager.consumer"]
          env:
            - name: REDIS_CONSUMER
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - configMapRef:
                name: agentic-config
            - secretRef:
                name: agentic-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            exec:
              command: ["python", "-c", "import sys; sys.exit(0)"]
            initialDelaySeconds: 30
            periodSeconds: 60
          readinessProbe:
            exec:
              command: ["python", "-c", "import sys; sys.exit(0)"]
            initialDelaySeconds: 10
            periodSeconds: 30
---

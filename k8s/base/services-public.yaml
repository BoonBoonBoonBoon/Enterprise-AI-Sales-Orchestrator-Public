apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: agentic-system
  labels:
    app: api-gateway
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
  selector:
    app: api-gateway
---
apiVersion: v1
kind: Service
metadata:
  name: portal
  namespace: agentic-system
  labels:
    app: portal
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
  selector:
    app: portal

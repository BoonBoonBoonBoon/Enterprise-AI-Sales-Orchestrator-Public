apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: agentic-aws-secrets
  namespace: agentic-system
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "agentic-system/prod"
        objectType: "secretsmanager"
        jmesPath:
          - path: OPENAI_API_KEY
            objectAlias: OPENAI_API_KEY
          - path: ANTHROPIC_API_KEY
            objectAlias: ANTHROPIC_API_KEY
          - path: REDIS_URL
            objectAlias: REDIS_URL
          - path: SUPABASE_URL
            objectAlias: SUPABASE_URL
          - path: SUPABASE_KEY
            objectAlias: SUPABASE_KEY
  secretObjects:
  - secretName: agentic-secrets
    type: Opaque
    data:
    - objectName: OPENAI_API_KEY
      key: OPENAI_API_KEY
    - objectName: ANTHROPIC_API_KEY
      key: ANTHROPIC_API_KEY
    - objectName: REDIS_URL
      key: REDIS_URL
    - objectName: SUPABASE_URL
      key: SUPABASE_URL
    - objectName: SUPABASE_KEY
      key: SUPABASE_KEY
